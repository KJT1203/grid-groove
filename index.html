<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grid Groove</title>
<style>
:root{
  --bg:#0b0d12; --panel:#141824; --line:#232a3b; --text:#e6ebf5; --dim:#7c88a3;
  --hot:#ff3d81; --cool:#39d9ff;
}
*{box-sizing:border-box}
body{
  margin:0; background:radial-gradient(1200px 600px at 50% -10%,#1a2033,var(--bg));
  color:var(--text); font:14px/1.4 ui-monospace,"Cascadia Mono",Consolas,monospace;
  min-height:100vh; padding:18px; -webkit-user-select:none; user-select:none;
}
h1{font-size:20px;letter-spacing:6px;margin:0}
h1 span{color:var(--hot)}
header{display:flex;flex-wrap:wrap;gap:18px;align-items:center;margin-bottom:16px}
.transport{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
label{display:flex;gap:8px;align-items:center;color:var(--dim);font-size:11px;letter-spacing:1px}
input[type=range]{width:110px;accent-color:var(--hot)}
output{color:var(--text);min-width:34px;display:inline-block}
button{
  background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;
  padding:7px 12px;font:inherit;font-size:12px;letter-spacing:1px;cursor:pointer;
}
button:hover{border-color:var(--hot)}
#play{min-width:96px;border-color:var(--hot);color:var(--hot)}
#play.on{background:var(--hot);color:#0b0d12}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:14px;overflow-x:auto}
.legend{color:var(--dim);font-size:10px;letter-spacing:2px;margin-bottom:8px}
.row{display:grid;grid-template-columns:150px repeat(16,1fr);gap:4px;align-items:center;margin-bottom:4px;min-width:720px}
.lane{display:flex;gap:6px;align-items:center;font-size:11px;letter-spacing:1px}
.lane .nm{width:46px;color:var(--dim)}
.lane .mute{padding:2px 6px;font-size:10px;border-radius:4px}
.lane .mute.on{background:#3a1020;border-color:var(--hot);color:var(--hot)}
.lane input[type=range]{width:56px}
.cell{
  height:26px;border-radius:5px;border:1px solid var(--line);background:#0f131d;cursor:pointer;
  transition:transform .05s;
}
.cell.on{background:var(--c);box-shadow:0 0 10px -2px var(--c)}
.cell.acc{background:var(--c);box-shadow:0 0 16px 0 var(--c);border-color:#ffffff66}
.cell.hit{transform:scale(.88)}
.col-now{outline:1px solid var(--cool);outline-offset:1px}
.steps{display:grid;grid-template-columns:150px repeat(16,1fr);gap:4px;min-width:720px;margin-bottom:6px;color:var(--dim);font-size:10px;text-align:center}
footer{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#msg{color:var(--cool);font-size:11px;letter-spacing:1px}
</style>
</head>
<body>
<header>
  <h1>GRID<span>GROOVE</span></h1>
  <div class="transport">
    <button id="play">&#9654; PLAY</button>
    <label>BPM <input id="bpm" type="range" min="60" max="180" value="112"><output id="bpmv">112</output></label>
    <label>SWING <input id="swing" type="range" min="0" max="60" value="16"><output id="swingv">16</output></label>
    <label>VOL <input id="vol" type="range" min="0" max="100" value="80"><output id="volv">80</output></label>
  </div>
</header>

<section id="drums">
  <div class="legend">DRUMS &mdash; click a cell: off / on / accent</div>
</section>

<section id="bassSec">
  <div class="legend">BASS &mdash; one note per column</div>
</section>

<footer>
  <button data-preset="house">HOUSE</button>
  <button data-preset="boombap">BOOM BAP</button>
  <button data-preset="breaks">BREAKS</button>
  <button id="rand">RANDOM</button>
  <button id="clear">CLEAR</button>
  <button id="share">COPY LINK</button>
  <span id="msg"></span>
</footer>

<script>
const STEPS = 16;
const DRUMS = [
  {id:'kick', nm:'KICK',  c:'#ff3d81'},
  {id:'snare',nm:'SNARE', c:'#ffb703'},
  {id:'clap', nm:'CLAP',  c:'#8ecae6'},
  {id:'hat',  nm:'HAT',   c:'#a3f7bf'},
  {id:'ohat', nm:'O-HAT', c:'#39d9ff'},
  {id:'tom',  nm:'TOM',   c:'#c77dff'},
  {id:'rim',  nm:'RIM',   c:'#f77f00'},
  {id:'ride', nm:'RIDE',  c:'#ffd166'},
  {id:'cow',  nm:'COWBELL',c:'#06d6a0'},
  {id:'conga',nm:'CONGA', c:'#ef8354'},
  {id:'shkr', nm:'SHAKER',c:'#b8c0ff'},
  {id:'stab', nm:'STAB',  c:'#e0aaff'}
];
// C minor pentatonic, highest row first
const NOTES = [{n:'C3',m:48},{n:'A#2',m:46},{n:'G2',m:43},{n:'F2',m:41},
               {n:'D#2',m:39},{n:'C2',m:36},{n:'A#1',m:34},{n:'G1',m:31}];
const midiToFreq = m => 440 * Math.pow(2,(m-69)/12);

const blank = () => ({
  bpm:112, swing:16, vol:80,
  drums:Object.fromEntries(DRUMS.map(d=>[d.id,new Array(STEPS).fill(0)])),
  bass:new Array(STEPS).fill(-1),
  mute:Object.fromEntries(DRUMS.map(d=>[d.id,0])),
  gain:Object.fromEntries(DRUMS.map(d=>[d.id,0.8])),
  bassMute:0, bassGain:0.8
});
let state = blank();

/* ---------- pattern encode/decode (URL + localStorage) ---------- */
function encode(s){
  const d = DRUMS.map(x=>s.drums[x.id].join('')).join(',');
  const b = s.bass.map(v=>v<0?'.':v).join('');
  return ['v1',s.bpm,s.swing,d,b].join('|');
}
function decode(str){
  const p = String(str).split('|');
  if(p[0]!=='v1' || p.length<5) return null;
  const s = blank();
  s.bpm = Math.min(180,Math.max(60,+p[1]||112));
  s.swing = Math.min(60,Math.max(0,+p[2]||0));
  p[3].split(',').forEach((lane,i)=>{
    if(!DRUMS[i]) return;
    s.drums[DRUMS[i].id] = Array.from({length:STEPS},(_,j)=>{
      const v = +lane[j]; return v===1||v===2 ? v : 0;
    });
  });
  s.bass = Array.from({length:STEPS},(_,j)=>{
    const ch = p[4][j];
    return (ch>='0' && ch<='7') ? +ch : -1;
  });
  return s;
}

/* ---------- audio ---------- */
let ac, master, laneGain={}, bassGainNode, noiseBuf;
function ensureAudio(){
  if(ac) return;
  ac = new (window.AudioContext||window.webkitAudioContext)();
  master = ac.createGain();
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value=-12; comp.ratio.value=4;
  master.connect(comp).connect(ac.destination);
  master.gain.value = state.vol/100;
  DRUMS.forEach(d=>{ const g=ac.createGain(); g.gain.value=state.gain[d.id]; g.connect(master); laneGain[d.id]=g; });
  bassGainNode = ac.createGain(); bassGainNode.gain.value=state.bassGain; bassGainNode.connect(master);
  noiseBuf = ac.createBuffer(1, ac.sampleRate*2, ac.sampleRate);
  const ch = noiseBuf.getChannelData(0);
  for(let i=0;i<ch.length;i++) ch[i] = Math.random()*2-1;
}
function noise(bus,t,dur,vel,type,freq,q,atk){
  const s=ac.createBufferSource(); s.buffer=noiseBuf;
  const f=ac.createBiquadFilter(); f.type=type; f.frequency.value=freq; if(q) f.Q.value=q;
  const g=ac.createGain();
  if(atk){ g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vel,t+atk); }
  else g.gain.setValueAtTime(Math.max(0.0001,vel),t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f).connect(g).connect(bus); s.start(t); s.stop(t+dur+0.02);
}
function tone(bus,t,f0,f1,dur,vel,type){
  const o=ac.createOscillator(); o.type=type||'sine';
  o.frequency.setValueAtTime(f0,t);
  o.frequency.exponentialRampToValueAtTime(f1,t+dur*0.8);
  const g=ac.createGain();
  g.gain.setValueAtTime(Math.max(0.0001,vel),t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(bus); o.start(t); o.stop(t+dur+0.02);
}
// 808-style cymbal: six inharmonic squares through band+highpass
function metal(bus,t,dur,vel,base,hp){
  const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=base*10; bp.Q.value=0.6;
  const h=ac.createBiquadFilter(); h.type='highpass'; h.frequency.value=hp;
  const g=ac.createGain();
  g.gain.setValueAtTime(Math.max(0.0001,vel),t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  [1,1.4472,1.6170,1.9265,2.5028,2.6637].forEach(r=>{
    const o=ac.createOscillator(); o.type='square'; o.frequency.value=base*r;
    o.connect(bp); o.start(t); o.stop(t+dur+0.02);
  });
  bp.connect(h).connect(g).connect(bus);
}
// plucked Cm triad, fixed to the key the bass rows are locked to
function stab(bus,t,dur,vel){
  const f=ac.createBiquadFilter(); f.type='lowpass'; f.Q.value=3;
  f.frequency.setValueAtTime(4200,t);
  f.frequency.exponentialRampToValueAtTime(700,t+dur);
  const g=ac.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(vel,t+0.006);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  [60,63,67].forEach(m=>{
    const o=ac.createOscillator(); o.type='sawtooth';
    o.frequency.value=midiToFreq(m); o.detune.value=Math.random()*10-5;
    o.connect(f); o.start(t); o.stop(t+dur+0.03);
  });
  f.connect(g).connect(bus);
}
function hit(id,t,vel){
  const bus = laneGain[id];
  switch(id){
    case 'kick':  tone(bus,t,150,45,0.4,vel); noise(bus,t,0.02,vel*0.3,'lowpass',400); break;
    case 'snare': tone(bus,t,190,120,0.12,vel*0.5,'triangle'); noise(bus,t,0.18,vel*0.6,'highpass',1200); break;
    case 'clap':  [0,0.012,0.026].forEach(o=>noise(bus,t+o,0.06,vel*0.5,'bandpass',1400,1.4));
                  noise(bus,t+0.03,0.22,vel*0.35,'bandpass',1200,1.1); break;
    case 'hat':   noise(bus,t,0.045,vel*0.45,'highpass',8000); break;
    case 'ohat':  noise(bus,t,0.32,vel*0.35,'highpass',7000); break;
    case 'tom':   tone(bus,t,220,90,0.3,vel*0.8); break;
    case 'rim':   tone(bus,t,1600,1200,0.03,vel*0.5,'square'); noise(bus,t,0.02,vel*0.3,'highpass',3000); break;
    case 'ride':  metal(bus,t,0.9,vel*0.16,300,5200); break;
    case 'cow':   tone(bus,t,540,540,0.14,vel*0.22,'square'); tone(bus,t,800,800,0.11,vel*0.18,'square'); break;
    case 'conga': tone(bus,t,400,300,0.22,vel*0.7); noise(bus,t,0.015,vel*0.2,'highpass',2000); break;
    case 'shkr':  noise(bus,t,0.13,vel*0.3,'bandpass',7000,1.2,0.02); break;
    case 'stab':  stab(bus,t,0.22,vel*0.28); break;
  }
}
function bassNote(t,row,dur,vel){
  const freq = midiToFreq(NOTES[row].m);
  const o=ac.createOscillator(); o.type='sawtooth'; o.frequency.value=freq;
  const o2=ac.createOscillator(); o2.type='square'; o2.frequency.value=freq/2;
  const f=ac.createBiquadFilter(); f.type='lowpass'; f.Q.value=7;
  f.frequency.setValueAtTime(Math.min(9000,freq*9),t);
  f.frequency.exponentialRampToValueAtTime(Math.max(80,freq*1.6),t+dur*0.9);
  const g=ac.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(vel,t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(f); o2.connect(f); f.connect(g).connect(bassGainNode);
  o.start(t); o2.start(t); o.stop(t+dur+0.05); o2.stop(t+dur+0.05);
}

/* ---------- clock (lookahead scheduler) ---------- */
let playing=false, step=0, nextTime=0, timer=null, shown=-1;
const queue=[];
const stepDur = () => 60/state.bpm/4;
function stepTime(base,i){ return i%2 ? base + stepDur()*(state.swing/100) : base; }

function scheduler(){
  // drain here too: rAF is frozen in a background tab, the queue must not grow forever
  while(queue.length && queue[0].t <= ac.currentTime) shown = queue.shift().step;
  while(nextTime < ac.currentTime + 0.12){
    const t = stepTime(nextTime,step);
    DRUMS.forEach(d=>{
      const v = state.drums[d.id][step];
      if(v && !state.mute[d.id]) hit(d.id,t,v===2?1:0.6);
    });
    const row = state.bass[step];
    if(row>=0 && !state.bassMute) bassNote(t,row,stepDur()*1.7,0.5);
    queue.push({step,t});
    nextTime += stepDur();
    step = (step+1)%STEPS;
  }
}
function start(){
  ensureAudio(); ac.resume();
  playing=true; step=0; nextTime=ac.currentTime+0.06; queue.length=0;
  timer=setInterval(scheduler,25);
  const b=document.getElementById('play');
  b.classList.add('on'); b.innerHTML='&#9632; STOP';
  requestAnimationFrame(draw);
}
function stop(){
  playing=false; clearInterval(timer); queue.length=0;
  const b=document.getElementById('play');
  b.classList.remove('on'); b.innerHTML='&#9654; PLAY';
  document.querySelectorAll('.col-now').forEach(e=>e.classList.remove('col-now'));
}
function draw(){
  if(!playing) return;
  while(queue.length && queue[0].t <= ac.currentTime) shown = queue.shift().step;
  document.querySelectorAll('.col-now').forEach(e=>e.classList.remove('col-now'));
  if(shown>=0) document.querySelectorAll('[data-step="'+shown+'"]').forEach(e=>e.classList.add('col-now'));
  requestAnimationFrame(draw);
}

/* ---------- ui ---------- */
function ruler(){
  const d=document.createElement('div'); d.className='steps';
  d.appendChild(document.createElement('div'));
  for(let i=0;i<STEPS;i++){
    const s=document.createElement('div');
    s.textContent = i%4 ? '·' : (i/4+1);
    d.appendChild(s);
  }
  return d;
}
function build(){
  const dSec=document.getElementById('drums'), bSec=document.getElementById('bassSec');
  dSec.querySelectorAll('.row,.steps').forEach(e=>e.remove());
  bSec.querySelectorAll('.row,.steps').forEach(e=>e.remove());
  dSec.appendChild(ruler());
  DRUMS.forEach(d=>{
    const row=document.createElement('div'); row.className='row';
    row.innerHTML='<div class="lane"><span class="nm">'+d.nm+'</span>'+
      '<button class="mute" data-mute="'+d.id+'">M</button>'+
      '<input type="range" min="0" max="100" data-gain="'+d.id+'" value="'+(state.gain[d.id]*100)+'"></div>';
    for(let i=0;i<STEPS;i++){
      const c=document.createElement('div');
      c.className='cell'; c.style.setProperty('--c',d.c);
      c.dataset.step=i; c.dataset.lane=d.id;
      row.appendChild(c);
    }
    dSec.appendChild(row);
  });
  bSec.appendChild(ruler());
  NOTES.forEach((n,r)=>{
    const row=document.createElement('div'); row.className='row';
    row.innerHTML = r===0
      ? '<div class="lane"><span class="nm">'+n.n+'</span><button class="mute" data-mute="bass">M</button>'+
        '<input type="range" min="0" max="100" data-gain="bass" value="'+(state.bassGain*100)+'"></div>'
      : '<div class="lane"><span class="nm">'+n.n+'</span></div>';
    for(let i=0;i<STEPS;i++){
      const c=document.createElement('div');
      c.className='cell'; c.style.setProperty('--c','#39d9ff');
      c.dataset.step=i; c.dataset.row=r;
      row.appendChild(c);
    }
    bSec.appendChild(row);
  });
  paint();
}
function paint(){
  document.querySelectorAll('[data-lane]').forEach(c=>{
    const v = state.drums[c.dataset.lane][+c.dataset.step];
    c.classList.toggle('on',v===1); c.classList.toggle('acc',v===2);
  });
  document.querySelectorAll('[data-row]').forEach(c=>{
    c.classList.toggle('on', state.bass[+c.dataset.step] === +c.dataset.row);
  });
  document.querySelectorAll('[data-mute]').forEach(b=>{
    const on = b.dataset.mute==='bass' ? state.bassMute : state.mute[b.dataset.mute];
    b.classList.toggle('on',!!on);
  });
  save();
}
function save(){
  try{ localStorage.setItem('gridgroove', encode(state)); }catch(e){}
}

document.body.addEventListener('click',e=>{
  const cell=e.target.closest('.cell');
  if(cell){
    ensureAudio();
    if(cell.dataset.lane){
      const lane=cell.dataset.lane, i=+cell.dataset.step;
      state.drums[lane][i]=(state.drums[lane][i]+1)%3;
      if(state.drums[lane][i]) hit(lane,ac.currentTime,state.drums[lane][i]===2?1:0.6);
    }else{
      const i=+cell.dataset.step, r=+cell.dataset.row;
      state.bass[i] = state.bass[i]===r ? -1 : r;
      if(state.bass[i]===r) bassNote(ac.currentTime,r,0.3,0.5);
    }
    cell.classList.add('hit'); setTimeout(()=>cell.classList.remove('hit'),60);
    paint(); return;
  }
  const m=e.target.closest('[data-mute]');
  if(m){
    if(m.dataset.mute==='bass') state.bassMute^=1; else state.mute[m.dataset.mute]^=1;
    paint(); return;
  }
  const p=e.target.closest('[data-preset]');
  if(p) load(PRESETS[p.dataset.preset]);
});
document.body.addEventListener('input',e=>{
  const g=e.target.dataset.gain;
  if(g===undefined) return;
  ensureAudio();
  const v=e.target.value/100;
  if(g==='bass'){ state.bassGain=v; bassGainNode.gain.value=v; }
  else { state.gain[g]=v; laneGain[g].gain.value=v; }
  save();
});

const $=id=>document.getElementById(id);
$('play').onclick = ()=> playing?stop():start();
$('bpm').oninput = e=>{ state.bpm=+e.target.value; $('bpmv').textContent=state.bpm; save(); };
$('swing').oninput = e=>{ state.swing=+e.target.value; $('swingv').textContent=state.swing; save(); };
$('vol').oninput = e=>{ state.vol=+e.target.value; $('volv').textContent=state.vol; ensureAudio(); master.gain.value=state.vol/100; save(); };
$('clear').onclick = ()=>{ const b=blank(); b.bpm=state.bpm; b.swing=state.swing; load(encode(b)); };
$('rand').onclick = ()=> load(encode(randomize()));
$('share').onclick = ()=>{
  const hash = '#'+encode(state);
  history.replaceState(null,'',hash);
  const url = location.origin+location.pathname+hash;
  if(navigator.clipboard) navigator.clipboard.writeText(url).then(()=>msg('link copied'),()=>msg('url updated'));
  else msg('url updated');
};
addEventListener('keydown',e=>{
  if(e.code==='Space' && e.target===document.body){ e.preventDefault(); playing?stop():start(); }
});
function msg(t){ $('msg').textContent=t; setTimeout(()=>{ $('msg').textContent=''; },1800); }

function load(str){
  const s=decode(str) || decode(PRESETS.house);
  const wasPlaying=playing;
  s.vol=state.vol; s.mute=state.mute; s.gain=state.gain; s.bassMute=state.bassMute; s.bassGain=state.bassGain;
  state=s;
  $('bpm').value=state.bpm; $('bpmv').textContent=state.bpm;
  $('swing').value=state.swing; $('swingv').textContent=state.swing;
  build();
  if(wasPlaying){ stop(); start(); }
}
function randomize(){
  const s=blank(); s.bpm=state.bpm; s.swing=state.swing;
  // per-step odds, so random patterns still land on sensible beats
  const odds={
    kick :[0.9,0,0,0.15, 0.15,0,0.25,0, 0.8,0,0,0.2, 0.15,0.2,0,0.15],
    snare:[0,0,0,0, 0.9,0,0,0.1, 0,0,0.1,0, 0.9,0,0,0.15],
    clap :[0,0,0,0, 0.3,0,0,0, 0,0,0,0, 0.3,0,0,0],
    hat  :new Array(16).fill(0.55),
    ohat :new Array(16).fill(0.08),
    tom  :new Array(16).fill(0.05),
    rim  :new Array(16).fill(0.08),
    ride :new Array(16).fill(0.06),
    cow  :[0,0,0,0, 0,0,0.2,0, 0,0,0,0, 0,0,0.2,0],
    conga:new Array(16).fill(0.1),
    shkr :new Array(16).fill(0.3),
    stab :[0.25,0,0,0.1, 0,0,0.15,0, 0.2,0,0,0.1, 0,0,0.15,0]
  };
  DRUMS.forEach(d=>{
    const p=odds[d.id] || new Array(16).fill(0.1);
    s.drums[d.id]=p.map(x=>Math.random()<x ? (Math.random()<0.25?2:1) : 0);
  });
  for(let i=0;i<STEPS;i++) if(Math.random()<0.35) s.bass[i]=Math.floor(Math.random()*NOTES.length);
  return s;
}
const PRESETS={
  house:   'v1|124|0|1000100010001000,0000100000001000,0000000000000000,0010001000100010,0000000000100000,0000000000000000,0000000000000000,0000000000000000,0000000000000000,0000000000000000,0000000100000001,0010000000100000|5..5..3..5..1..3',
  boombap: 'v1|88|22|1000000000100000,0000100000001000,0000000000000000,1010101010101010,0000000000000000,0000000000000100,0000001000000000,0000000000000000,0000000000000000,0000000100000010,0000000000000000,1000000000000000|5.....5...3.....',
  breaks:  'v1|150|8|1000001000100000,0000100000001000,0000000000000000,1010101010101010,0000000000001000,0000000000000010,0001000000000000,0000100000001000,0000000000100000,0000000000000000,0000101000001010,0000000000000000|5..5.3..5..1..3.'
};

/* ---------- boot ---------- */
// read the seed before build(), which paints+saves and would clobber the saved pattern
load(location.hash.slice(1) || localStorage.getItem('gridgroove') || PRESETS.house);

/* ponytail: one runnable check — open index.html?test=1 */
if(location.search.indexOf('test=1')>-1){
  const eq=(a,b,m)=>{ if(JSON.stringify(a)!==JSON.stringify(b)) throw new Error(m+': '+a+' != '+b); };
  eq(Math.round(midiToFreq(69)),440,'a440');
  Object.keys(PRESETS).forEach(k=>eq(encode(decode(PRESETS[k])),PRESETS[k],'roundtrip '+k));
  eq(decode('garbage'),null,'reject bad input');
  eq(decode('v1|999|99|'+DRUMS.map(()=>'0'.repeat(16)).join(',')+'|'+'.'.repeat(16)).bpm,180,'bpm clamp');
  state.bpm=120; state.swing=50;
  eq(+stepTime(0,1).toFixed(4), +(stepDur()*0.5).toFixed(4),'swing offsets odd steps');
  eq(stepTime(0,2),0,'even steps stay on grid');
  msg('self-test passed');
  console.log('self-test passed');
}
</script>
